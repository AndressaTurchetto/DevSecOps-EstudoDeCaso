# Teste

name: Flask CI/CD Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    name: Build, Testes e Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        run: |
          python -m unittest discover -s todo_project/tests -p "test_*.py"

      - name: Análise Estática com Bandit
        run: |
          pip install bandit
          bandit -r . -o bandit_report.txt -f txt

      - name: Análise de dependências com OWASP Dependency-Check
        run: |
          docker run --rm \
            -v $(pwd):/src \
            owasp/dependency-check \
            --project "Gerenciador de Tarefas" \
            --scan /src \
            --format "HTML" \
            --out /src/dependency-check-report

      - name: Build da imagem Docker
        run: |
          docker build -t gerenciador-tarefas:${{ github.sha }} .

      - name: Rodar container com Docker Compose
        run: |
          docker-compose up -d

  dast-analysis:
    name: Análise Dinâmica (OWASP ZAP)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Rodar OWASP ZAP Scan
        run: |
          docker run -u zap --network="host" -v $(pwd):/zap/wrk \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://host.docker.internal:8080 \
          -r zap_report.html

  entrega-continua:
    name: Deploy e Monitoramento
    needs: dast-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Deploy para ambiente de stage (simulado)
        run: echo "Deploy para ambiente de stage realizado com sucesso!"

      - name: Simulação de Monitoramento (logs e alertas)
        run: |
          echo "Monitorando logs..."
          echo "Logs encaminhados para syslog"
          echo "Alertas configurados com Loki, Prometheus e Alertmanager (simulado)"

name: Flask CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          export PYTHONPATH=${{ github.workspace }}/todo_project
          python todo_project/tests/test_basic.py

      - name: Bandit - Análise Estática de Código
        run: |
          pip install bandit
          bandit -r todo_project

      - name: OWASP Dependency-Check - Análise de Dependências
        run: |
          docker pull owasp/dependency-check
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            owasp/dependency-check \
            --project "FlaskApp" \
            --scan /src \
            --format "HTML" \
            --out /src/reports

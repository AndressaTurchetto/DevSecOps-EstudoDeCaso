name: Flask CI/CD com SAST e DAST

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/todo_project
          python -m unittest discover -s todo_project/tests -p "test_*.py"

      - name: Bandit - SAST
        run: |
          pip install bandit
          bandit -r todo_project --exit-zero

      - name: Dependency-Check
        run: |
          mkdir -p dependency-check-report
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            owasp/dependency-check \
            --project "FlaskApp" \
            --scan /project \
            --format "ALL" \
            --out /project/dependency-check-report || true

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  deploy-and-test-zap:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Criar rede Docker customizada
        run: docker network create zapnet || true

      - name: Build da aplicação Flask
        run: docker build -t flaskapp .

      - name: Rodar aplicação Flask na rede zapnet
        run: docker run -d --rm --name flaskapp_container --network zapnet -p 8080:8080 flaskapp

      - name: Aguardar app iniciar
        run: sleep 10

      - name: Executar ZAP apontando para flaskapp_container
        run: |
          docker run --rm --network zapnet \
            -u root \
            -v ${{ github.workspace }}:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://flaskapp_container:8080 \
            -r zap_report.html

      - name: Upload do relatório do ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

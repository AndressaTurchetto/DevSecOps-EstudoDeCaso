name: Flask CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/todo_project
          python -m unittest discover -s todo_project/tests -p "test_*.py"

      - name: Bandit - Análise Estática de Código
        run: |
          pip install bandit
          bandit -r todo_project --exit-zero

      - name: Criar diretório de relatório
        run: mkdir -p dependency-check-report

      - name: OWASP Dependency-Check - Análise de Dependências
        run: |
          docker pull owasp/dependency-check
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            owasp/dependency-check \
            --project "FlaskApp" \
            --scan /project \
            --format "ALL" \
            --disableAssembly --disableRetireJS --disableCentral \
            --out /project/dependency-check-report || true

      - name: Upload do relatório de dependências
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  review-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Docker da aplicação para preview
        run: docker build -t flaskapp-preview .

      - name: Subir container temporário de preview
        run: |
          docker run -d --rm --name flaskapp_preview -p 8081:8080 flaskapp-preview
          echo "Ambiente de preview disponível em http://localhost:8081 (acessível apenas localmente no runner)"

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Criar rede para integração ZAP
        run: docker network create zapnet

      - name: Build Docker da aplicação
        run: docker build -t flaskapp .

      - name: Subir container Flask em background
        run: docker run -d --name flaskapp_container --network zapnet -p 8080:8080 flaskapp

    dast-zap:
    runs-on: ubuntu-latest
    needs: deploy-to-staging

    steps:
      - name: Criar rede para integração ZAP
        run: docker network create zapnet

      - name: Subir container da aplicação (ambiente DAST isolado)
        run: |
          docker build -t flaskapp .
          docker run -d --name flaskapp_container --network zapnet -p 8080:8080 flaskapp

      - name: Esperar aplicação iniciar
        run: sleep 10

      - name: Executar OWASP ZAP - DAST
        run: |
          docker run --rm --network zapnet -u root -v ${{ github.workspace }}:/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://flaskapp_container:8080 \
            -r zap_report.html

      - name: Upload do relatório ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

  monitoramento:
    runs-on: ubuntu-latest
    needs: dast-zap

    steps:
      - name: Simulação de Monitoramento Pós-Deploy
        run: |
          echo "Monitorando logs e atividades da aplicação..."
          echo "Exemplo de alerta: Múltiplas tentativas de login falhadas detectadas"
          echo "Monitoramento concluído - considere integrar Loki, Grafana, Sentry ou Prometheus futuramente"

      - name: Verificar logs com script
        run: |
          python monitor/check_logs.py || echo "Nenhuma anomalia detectada"


  monitoramento:
    runs-on: ubuntu-latest
    needs: dast-zap

    steps:
      - name: Simulação de Monitoramento Pós-Deploy
        run: |
          echo "Monitorando logs e atividades da aplicação..."
          echo "Exemplo de alerta: Múltiplas tentativas de login falhadas detectadas"
          echo "Monitoramento concluído - considere integrar Loki, Grafana, Sentry ou Prometheus futuramente"

      - name: Verificar logs com script
        run: |
          python monitor/check_logs.py || echo "Nenhuma anomalia detectada."

name: Flask CI/CD

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          export PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/todo_project
          python -m unittest discover -s todo_project/tests -p "test_*.py"

      - name: Bandit - Análise Estática de Código
        run: |
          pip install bandit
          bandit -r todo_project --exit-zero

      - name: Criar diretório de relatório
        run: mkdir -p reports

      - name: OWASP Dependency-Check - Análise de Dependências
        run: |
          mkdir -p reports
          docker pull owasp/dependency-check
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            --entrypoint dependency-check.sh \
            owasp/dependency-check \
            --project "FlaskApp" \
            --scan /src \
            --format "HTML" \
            --out /src/reports


      - name: Upload do relatório de dependências
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Simular Deploy em Ambiente de Staging
        run: |
          echo "🔄 Simulando deploy da aplicação Flask para STAGING..."
          echo "📝 Aqui você pode colocar comandos reais de deploy (ex: docker compose up, rsync, kubectl, etc)"

  dast-zap:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    steps:
      - name: Executar OWASP ZAP - DAST
        run: |
          docker run -u zap -v ${{ github.workspace }}:/zap/wrk -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap_report.html

      - name: Upload do relatório ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

  monitoramento:
    runs-on: ubuntu-latest
    needs: dast-zap
    steps:
      - name: Simulação de Monitoramento Pós-Deploy
        run: |
          echo "📡 Monitorando logs e atividades da aplicação..."
          echo "⚠️ Exemplo de alerta: Múltiplas tentativas de login falhadas detectadas"
          echo "✅ Monitoramento concluído - considere integrar Loki, Grafana, Sentry ou Prometheus futuramente"
